target-version = "py310"
line-length = 120
extend-exclude = [".venv", "data"]

[lint]
# Pyflakes + pycodestyle errors (ruff defaults). `src.config` must run load_dotenv before
# reading env vars, so module-level imports after code are allowed there.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
"src/config.py" = ["E402"]
"debug.py" = ["E402"]
